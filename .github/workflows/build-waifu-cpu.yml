name: Build Waifu2X CPU & Unified Package

on:
  workflow_dispatch:
    inputs:
      update_release:
        description: "Fazer upload do Waifu2X.zip na release 'waifu2x'?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official waifu2x-ncnn-vulkan
        shell: pwsh
        run: |
          $repo = "nihui/waifu2x-ncnn-vulkan"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*-windows.zip" } | Select-Object -First 1
          Write-Host "Baixando release oficial: $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "waifu2x-official.zip"
          Expand-Archive -Path "waifu2x-official.zip" -DestinationPath "waifu2x-package"

          $sub = Get-ChildItem -Path "waifu2x-package" -Directory | Select-Object -First 1
          if ($sub) {
            Move-Item "$($sub.FullName)/*" "waifu2x-package/"
            Remove-Item $sub.FullName -Recurse -Force
          }

      - name: Clone and Build waifu2x CPU Native
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/nihui/waifu2x-ncnn-vulkan.git waifu-src
          cd waifu-src
          git submodule update --init --recursive --depth 1

          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DUSE_SYSTEM_NCNN=OFF `
            -DNCNN_VULKAN=OFF `
            -DNCNN_BUILD_EXAMPLES=OFF `
            -DNCNN_BUILD_TESTS=OFF `
            -DNCNN_BUILD_BENCHMARK=OFF `
            -DNCNN_BUILD_TOOLS=OFF

          cmake --build build --config Release -j 4

          $cpuExe = Get-ChildItem -Path "build" -Filter "waifu2x-ncnn-vulkan.exe" -Recurse | Select-Object -First 1
          if (-not $cpuExe) {
            Write-Error "Executável compilado waifu2x não foi encontrado!"
            exit 1
          }

          Copy-Item $cpuExe.FullName -Destination "../waifu2x-package/waifu2x-ncnn-cpu.exe"
          cd ..

      - name: Optimize and Clean Package
        shell: pwsh
        run: |
          Get-ChildItem -Path "waifu2x-package"

          New-Item -ItemType Directory -Force -Path "dist_waifu"
          $zipPath = "dist_waifu/Waifu2X.zip"

          Compress-Archive -Path "waifu2x-package/*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Pacote unificado Waifu2X.zip gerado com sucesso!"
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waifu2X-Unified-Package
          path: dist_waifu/Waifu2X.zip
          retention-days: 14

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.update_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload waifu2x dist_waifu/Waifu2X.zip --clobber
